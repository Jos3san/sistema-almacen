# Continuous integration (T-08, docs/00 and docs/06 D1.10).
# Runs on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A new push to the same PR cancels its run in progress. Runs on main are never
# cancelled: every merged commit must be verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-tests:
    name: core / lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/core
    steps:
      # Actions are pinned to a commit SHA (immutable); the comment shows the version.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies (exactly as in uv.lock)
        run: uv sync --locked

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint (Ruff)
        run: uv run ruff check .

      # Testcontainers starts a real PostgreSQL with the runner's Docker.
      - name: Run tests (pytest)
        run: uv run pytest -v

      # Known vulnerabilities (CVE) in the exact versions of uv.lock (docs/06 D1.10).
      # --no-emit-local leaves out libs/security itself (it has no published hash);
      # its own dependencies, such as PyJWT, are still audited.
      - name: Audit dependencies (pip-audit)
        run: |
          uv export --frozen --format requirements-txt --no-emit-project --no-emit-local -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip

      # The shared library that core installs (libs/security, T-11): same checks.
      - name: Shared library libs/security (Ruff and pytest)
        working-directory: libs/security
        run: |
          uv sync --locked
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest -v

  core-image:
    name: core / Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same command as locally: context = repo root (docs/06 D1.5). Nothing is pushed.
      - name: Build the image
        run: docker build -f services/core/Dockerfile -t core:ci .

      # Fails on HIGH or CRITICAL vulnerabilities that already have a fix
      # (operating system and Python packages inside the image).
      - name: Scan the image (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2 image --quiet --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 core:ci
