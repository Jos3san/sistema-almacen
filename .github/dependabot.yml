# Dependabot version updates (T-20, docs/06 D1.10).
# Every Monday it opens PRs for outdated dependencies; each PR must pass CI.
version: 2
updates:
  # All Python packages (app, dev and build) in ONE weekly PR: they all edit
  # pyproject.toml and uv.lock, so separate PRs would conflict with each other.
  - package-ecosystem: uv
    directory: /services/core
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    groups:
      python-packages:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  # Base images in the Dockerfile (Python, uv).
  - package-ecosystem: docker
    directory: /services/core
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    ignore:
      # Changing the Python version (3.13 -> 3.14, 3.15...) is an architecture
      # decision (ADR-0006), not an automatic update: only patches (3.13.x).
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build(deps)"

  # Images in compose.yaml (PostgreSQL, Caddy).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    ignore:
      # A new PostgreSQL major version needs a data migration (pg_upgrade): planned by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  # Actions in .github/workflows, pinned by SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    commit-message:
      prefix: "ci(deps)"
