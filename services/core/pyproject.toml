[project]
name = "core"
version = "0.1.0"
description = "Core service: catalog, stock, orders and dispatch"
readme = "README.md"
authors = [
    { name = "JSantos", email = "53391239+Jos3san@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.162.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# S: security (Bandit), C90: complexity (docs/06 D1.10 and D1.11).
select = ["E", "F", "I", "B", "UP", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Alembic's template always imports op and sa, even in a migration that does not use them.
"migrations/versions/*" = ["F401"]
# Tests use assert (pytest) and throwaway passwords for test databases.
"tests/*" = ["S101", "S105", "S106"]
