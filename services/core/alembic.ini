# Alembic configuration of the core service (T-10, docs/06 D1.5).
# The database URL is NOT here: migrations/env.py reads it from the
# MIGRATION_DATABASE_URL environment variable (docs/06 D1.6).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# File names start with the date, so they sort in creation order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Every new migration file is formatted with Ruff, so CI does not reject it.
[post_write_hooks]
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME
