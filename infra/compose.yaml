# Local environment of the MVP: gateway (Caddy) + core + PostgreSQL (T-06, T-07, docs/06 D1.2).
# Open http://localhost/api/core/docs once everything is healthy.
# From the repo root:  docker compose -f infra/compose.yaml up -d --build
# Values come from infra/.env (copy infra/.env.example; .env is never committed).

name: almacen

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
    volumes:
      # PostgreSQL 18+ keeps its data under /var/lib/postgresql/18/...:
      # mount the parent folder (not .../data as in older versions).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # No "ports": the database is reachable only inside the Docker network (docs/06 D1.10).

  core:
    build:
      context: ..
      dockerfile: services/core/Dockerfile
    image: core:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The gateway removes /api/core before forwarding; root_path makes /docs
      # and its links work behind that prefix (docs/06 D1.2).
      UVICORN_ROOT_PATH: /api/core
      # Trust X-Forwarded-For from the gateway, so logs show the client IP.
      # Safe because core has no published port: only the gateway reaches it.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    # No "ports": core is reachable only through the gateway.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  gateway:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # Hardening: unprivileged user, read-only filesystem, writable temp folders only.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /data:mode=1777
      - /config:mode=1777
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Local only: http://localhost. Staging and production use 80/443 with HTTPS (T-14).
      - "127.0.0.1:80:8080"
    depends_on:
      core:
        condition: service_healthy

volumes:
  pgdata:
