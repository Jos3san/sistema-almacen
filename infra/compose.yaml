# Local environment of the MVP: gateway (Caddy) + auth + core + PostgreSQL (T-06, T-07, T-10, T-12, docs/06 D1.2).
# Start order: db (healthy) -> migrate jobs (run once and exit) -> auth and core (healthy) -> gateway.
# Open http://localhost/api/core/docs and http://localhost/api/auth/docs once everything is healthy.
# From the repo root:  docker compose -f infra/compose.yaml up -d --build
# Values come from infra/.env (copy infra/.env.example; .env is never committed).

name: almacen

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      # Administrator: only creates the databases and roles on the first start.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      # Read by postgres/init/10-core.sh and 20-auth.sh to create each service's roles.
      CORE_OWNER_PASSWORD: ${CORE_OWNER_PASSWORD:?set CORE_OWNER_PASSWORD in infra/.env}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?set CORE_APP_PASSWORD in infra/.env}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD:?set AUTH_OWNER_PASSWORD in infra/.env}
      AUTH_APP_PASSWORD: ${AUTH_APP_PASSWORD:?set AUTH_APP_PASSWORD in infra/.env}
    volumes:
      # PostgreSQL 18+ keeps its data under /var/lib/postgresql/18/...:
      # mount the parent folder (not .../data as in older versions).
      - pgdata:/var/lib/postgresql
      # Scripts that run only once, when the data volume is empty.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # No "ports": the database is reachable only inside the Docker network (docs/06 D1.10).

  # ---------------- core ----------------

  # One-shot container: applies core's pending migrations as the schema owner and exits.
  migrate:
    build:
      context: ..
      dockerfile: services/core/Dockerfile
    image: core:dev
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://core_owner:${CORE_OWNER_PASSWORD}@db:5432/core_db
    depends_on:
      db:
        condition: service_healthy

  core:
    build:
      context: ..
      dockerfile: services/core/Dockerfile
    image: core:dev
    restart: unless-stopped
    environment:
      # Application user: reads and writes rows, cannot change tables (docs/06 D1.6).
      DATABASE_URL: postgresql+psycopg://core_app:${CORE_APP_PASSWORD}@db:5432/core_db
      # The gateway removes /api/core before forwarding; root_path makes /docs
      # and its links work behind that prefix (docs/06 D1.2).
      UVICORN_ROOT_PATH: /api/core
      # Trust X-Forwarded-For from the gateway, so logs show the client IP.
      # Safe because core has no published port: only the gateway reaches it.
      FORWARDED_ALLOW_IPS: "*"
      # auth's public key, to validate access tokens without calling auth (ADR-0007).
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
    volumes:
      # Created by infra/scripts/generate_jwt_keys.py; never committed.
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No "ports": core is reachable only through the gateway.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ---------------- auth ----------------

  # One-shot container: applies auth's pending migrations as auth_owner and exits.
  auth-migrate:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    image: auth:dev
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://auth_owner:${AUTH_OWNER_PASSWORD}@db:5432/auth_db
    depends_on:
      db:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    image: auth:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://auth_app:${AUTH_APP_PASSWORD}@db:5432/auth_db
      UVICORN_ROOT_PATH: /api/auth
      FORWARDED_ALLOW_IPS: "*"
      # Only auth has the private key that signs access tokens (ADR-0007).
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    depends_on:
      db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Creates the first owner user (HU-05). Not started by "up": run it once with
  #   docker compose -f infra/compose.yaml --profile setup run --rm auth-bootstrap
  auth-bootstrap:
    image: auth:dev
    profiles: ["setup"]
    command: ["python", "-m", "auth.bootstrap"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://auth_app:${AUTH_APP_PASSWORD}@db:5432/auth_db
      # Required by the settings but never read by this command.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # ---------------- gateway ----------------

  gateway:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # Hardening: unprivileged user, read-only filesystem, writable temp folders only.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /data:mode=1777
      - /config:mode=1777
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Local only: http://localhost. Staging and production use 80/443 with HTTPS (T-14).
      - "127.0.0.1:80:8080"
    depends_on:
      core:
        condition: service_healthy
      auth:
        condition: service_healthy

volumes:
  pgdata:
